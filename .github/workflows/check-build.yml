# Fails if data/publications.js was edited without running `node tools/build.js`
name: Check index.html is up to date
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.js --check
