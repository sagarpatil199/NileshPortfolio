<!doctype html>
<!-- Source for assets/og-image.png (1200×630 link-preview card).
     Regenerate with: node tools/render-images.js -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#f7f5f0;color:#131a2a;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:1fr 430px;overflow:hidden}
  .l{padding:72px 0 64px 80px;display:flex;flex-direction:column}
  .eyebrow{font:500 20px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#a84d22}
  .id{display:flex;gap:30px;align-items:center;margin:34px 0 30px}
  img{width:150px;height:172px;object-fit:cover;border-radius:18px;box-shadow:0 18px 40px -16px rgba(19,26,42,.4)}
  h1{font:600 70px/1.02 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0}
  .role{font-size:27px;line-height:1.4;color:#3d4658;margin:0}
  .url{margin-top:auto;font:500 21px 'JetBrains Mono',monospace;color:#646c7e}
  .r{background:#131a2a;display:grid;place-items:center}
  svg{width:330px}
</style></head><body>
  <div class="l">
    <div class="eyebrow">Experimental Condensed Matter Physics</div>
    <div class="id"><img src="../assets/photo.jpg" alt=""><h1>Dr. Nilesh<br>Chougle</h1></div>
    <p class="role">Research Scholar, Department of Physics<br>KLE Technological University, Hubli</p>
    <div class="url">sagarpatil199.github.io/NileshPortfolio</div>
  </div>
  <div class="r">
    <svg viewBox="-120 -120 240 240" fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M-100 0H100M0 -100V100" stroke="#3b4660" stroke-width="2"/>
      <!-- y is flipped (SVG y points down) so M rises to the upper right -->
      <path d="M100 -78C40 -78 -10 -70 -25 -10S-60 78 -100 78" stroke="#e0875a"/>
      <path d="M-100 78C-40 78 10 70 25 10S60 -78 100 -78" stroke="#7aa6e0"/>
    </svg>
  </div>
</body></html>
